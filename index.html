<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flipper Hero</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="logo-title">FLIPPER HERO</div>

            <nav>
                <a href="#">HOW IT WORKS</a>
                <a href="#">QUEST LOG</a>
                <a href="#" class="sign-in">SIGN IN</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="stamp">
                    SHIPMENT NOTICE
                </div>

                <div class="hero-copy">
                    <p class="eyebrow">
                        PLACEHOLDER
                    </p>

                    <h1>
                        YOUR HERO'S<br>
                        <em>JOURNEY</em>
                        STARTS HERE.
                    </h1>

                    <div class="note">
                        Unfortunately,<br>
                        <strong>the hero needs to ship.</strong>
                    </div>

                    <div class="policy">
                        <p class="small-label">
                            THE SHIP POLICY
                        </p>
                        <div class="policy-main">
                            <span>WE DELIEVER HARDWARE.</span>
                            <span>YOU DELIEVER PROJECTS.</span>
                        </div>

                        <p class="handwritten">
                            Seems fair enough.
                        </p>
                    </div>
                </div>
            </section>
    </body>
</html>
